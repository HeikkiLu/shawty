version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-urlshortener}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-urlshortener}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-urlshortener}
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      BASE_URL: ${BASE_URL:-http://localhost:8080/}
      DOMAIN: 0.0.0.0
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
